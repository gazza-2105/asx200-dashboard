name: Update dashboard

on:
  schedule:
    - cron: "30 7 * * 1-5"   # 07:30 UTC Mon-Fri = 5:30pm AEST / 6:30pm AEDT, after the ASX close
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch ASX 200 data and build dashboard
        run: python asx200_dashboard.py --no-open --cdn --workers 4
      - name: Assemble site
        run: |
          mkdir -p site
          cp output/asx200_dashboard.html site/index.html
          cp output/asx200_data_*.csv site/asx200_data.csv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
